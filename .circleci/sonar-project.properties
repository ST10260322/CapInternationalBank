# SonarQube Project Configuration
sonar.projectKey=customer-portal-banking
sonar.projectName=CAP International Bank - Customer Portal
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js,**/coverage/**

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8

# Coverage (if you add tests)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Security
sonar.security.hotspots.enabled=true