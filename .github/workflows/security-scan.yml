name: Security Scanning Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: [backend, frontend]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install Dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          echo "Running npm audit for ${{ matrix.directory }}..."
          npm audit --production --audit-level=moderate || true
          npm audit --json > audit-report-${{ matrix.directory }}.json || true
        continue-on-error: true
      
      - name: Check for Known Vulnerabilities
        working-directory: ${{ matrix.directory }}
        run: |
          echo "Checking for critical and high vulnerabilities..."
          AUDIT_RESULT=$(npm audit --audit-level=high 2>&1 || true)
          echo "$AUDIT_RESULT"
          
          if echo "$AUDIT_RESULT" | grep -q "found 0 vulnerabilities"; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "⚠️ Vulnerabilities detected - review required"
          fi
      
      - name: Upload Audit Report
        uses: actions/upload-artifact@v3
        with:
          name: security-audit-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/audit-report-${{ matrix.directory }}.json
          retention-days: 30

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check Outdated Packages (Backend)
        working-directory: backend
        run: |
          echo "Checking for outdated packages in backend..."
          npm outdated || true
      
      - name: Check Outdated Packages (Frontend)
        working-directory: frontend
        run: |
          echo "Checking for outdated packages in frontend..."
          npm outdated || true

  code-quality:
    name: Code Quality & Security Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Check for Hardcoded Secrets
        run: |
          echo "Scanning for hardcoded secrets and sensitive data..."
          
          # Check for potential API keys
          echo "Checking for API keys..."
          grep -r "api[_-]key\s*=\s*['\"]" --include="*.js" --include="*.json" backend/ frontend/ || echo "No API keys found"
          
          # Check for hardcoded passwords
          echo "Checking for hardcoded passwords..."
          grep -r "password\s*=\s*['\"][^'\"]\{8,\}" --include="*.js" backend/ frontend/ || echo "No hardcoded passwords found"
          
          # Check for database credentials
          echo "Checking for database credentials..."
          grep -r "mongodb.*:\/\/.*:.*@" --include="*.js" backend/ || echo "No exposed DB credentials in code"
          
          echo "✅ Secret scanning complete"

  security-headers-check:
    name: Security Headers Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Verify Security Middleware
        run: |
          echo "Checking for security middleware implementation..."
          
          # Check for Helmet
          if grep -q "helmet" backend/server.js; then
            echo "✅ Helmet middleware found"
          else
            echo "❌ Helmet middleware missing"
            exit 1
          fi
          
          # Check for CORS
          if grep -q "cors" backend/server.js; then
            echo "✅ CORS configuration found"
          else
            echo "❌ CORS configuration missing"
            exit 1
          fi
          
          # Check for rate limiting
          if grep -q "rateLimit" backend/server.js; then
            echo "✅ Rate limiting found"
          else
            echo "❌ Rate limiting missing"
            exit 1
          fi
          
          # Check for CSRF protection
          if grep -q "csrf" backend/server.js; then
            echo "✅ CSRF protection found"
          else
            echo "❌ CSRF protection missing"
            exit 1
          fi
          
          echo "✅ All security middleware checks passed"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-check, code-quality, security-headers-check]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Generate Report Summary
        run: |
          echo "# Security Scan Summary" > security-report.md
          echo "" >> security-report.md
          echo "**Date:** $(date)" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Scans Completed:" >> security-report.md
          echo "- ✅ Dependency vulnerability scan" >> security-report.md
          echo "- ✅ Outdated package check" >> security-report.md
          echo "- ✅ Hardcoded secrets scan" >> security-report.md
          echo "- ✅ Security middleware verification" >> security-report.md
          echo "" >> security-report.md
          echo "All security checks completed successfully! 🎉" >> security-report.md
      
      - name: Upload Security Report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md
          retention-days: 90